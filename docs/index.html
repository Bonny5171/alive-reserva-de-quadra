<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Reserva - Tennis Club</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #e1058b 0%, #021D49 100%);
            min-height: 100vh;
            padding: 20px;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 24px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #021D49 0%, #0a2a5e 100%);
            color: white;
            padding: 32px;
            text-align: center;
            position: relative;
        }

        .header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><circle cx="50" cy="50" r="2" fill="white" opacity="0.1"/><circle cx="20" cy="20" r="1" fill="white" opacity="0.15"/><circle cx="80" cy="30" r="1.5" fill="white" opacity="0.1"/><circle cx="30" cy="80" r="1" fill="white" opacity="0.12"/></svg>');
        }

        .header h1 {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 8px;
            position: relative;
            z-index: 1;
        }

        .header p {
            font-size: 1.1rem;
            opacity: 0.9;
            position: relative;
            z-index: 1;
        }

        .content {
            padding: 40px;
        }

        .status-badge {
            display: inline-block;
            background: linear-gradient(135deg, #e1058b, #c4047a);
            color: white;
            padding: 8px 20px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.9rem;
            margin-bottom: 32px;
            box-shadow: 0 4px 12px rgba(225, 5, 139, 0.3);
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 24px;
            margin-bottom: 40px;
        }

        .info-card {
            background: white;
            border-radius: 16px;
            padding: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 48px rgba(0, 0, 0, 0.15);
        }

        .info-card h3 {
            color: #021D49;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .icon {
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #e1058b, #021D49);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .icon svg {
            width: 80%;
            height: 80%;
            fill: white; /* ou currentColor para herdar a cor */
        }

        .info-value {
            font-size: 1.3rem;
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .info-detail {
            color: #666;
            font-size: 0.95rem;
        }

        .participants {
            background: white;
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 32px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .participants-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .participants h3 {
            color: #021D49;
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .format-toggle {
            background: linear-gradient(135deg, #e1058b, #c4047a);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .format-toggle:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 12px rgba(225, 5, 139, 0.3);
        }

        /* Layout para Singles (1x1) */
        .singles-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: center;
            min-height: 120px;
        }

        .court-divider {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 4px;
            height: 80px;
            background: linear-gradient(135deg, #021D49, #e1058b);
            border-radius: 2px;
            z-index: 1;
        }

        .court-side {
            position: relative;
            display: flex;
            justify-content: center;
        }

        /* Layout para Duplas (2x2) */
        .doubles-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 40px;
            align-items: start;
        }

        .team {
            display: flex;
            flex-direction: column;
            gap: 16px;
            align-items: center;
        }

        .team-label {
            font-weight: 700;
            color: #021D49;
            font-size: 1.1rem;
            margin-bottom: 8px;
        }

        .player {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 12px;
            padding: 16px;
            text-align: center;
            transition: all 0.3s ease;
            border: 2px solid transparent;
            width: 100%;
            max-width: 200px;
        }

        .player:hover {
            transform: scale(1.02);
            border-color: #e1058b;
        }

        .player-avatar {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, #e1058b, #021D49);
            border-radius: 50%;
            margin: 0 auto 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 1.4rem;
        }

        .player-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 4px;
        }

        .player-role {
            color: #666;
            font-size: 0.9rem;
        }

        .vs-indicator {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, #021D49, #e1058b);
            color: white;
            padding: 12px 20px;
            border-radius: 50px;
            font-weight: bold;
            font-size: 1.2rem;
            z-index: 2;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
        }

        .participants-container {
            position: relative;
        }

        .actions {
            display: flex;
            gap: 16px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            min-width: 160px;
            justify-content: center;
        }

        .btn-extend {
            background: linear-gradient(135deg, #e1058b, #c4047a);
            color: white;
            box-shadow: 0 6px 20px rgba(225, 5, 139, 0.3);
        }

        .btn-extend:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(225, 5, 139, 0.4);
        }

        .btn-cancel {
            background: linear-gradient(135deg, #021D49, #0a2a5e);
            color: white;
            box-shadow: 0 6px 20px rgba(2, 29, 73, 0.3);
        }

        .btn-cancel:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(2, 29, 73, 0.4);
        }

        .btn i {
            font-size: 1.1rem;
        }

        /* Loading Layer */
        .loading-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }

        .loading-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }

        .loading-content {
            text-align: center;
            color: #021D49;
        }

        .loading-spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(2, 29, 73, 0.1);
            border-top: 4px solid #e1058b;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading-text {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .loading-subtitle {
            font-size: 0.9rem;
            opacity: 0.7;
        }

        @media (max-width: 600px) {
            .container {
                margin: 10px;
                border-radius: 16px;
            }

            .header {
                padding: 24px 20px;
            }

            .header h1 {
                font-size: 1.8rem;
            }

            .content {
                padding: 24px 20px;
            }

            .info-grid {
                grid-template-columns: 1fr;
                gap: 16px;
            }

            .singles-layout,
            .doubles-layout {
                grid-template-columns: 1fr;
                gap: 30px;
                position: relative;
            }

            .doubles-layout {
                padding: 0;
            }

            .court-divider {
                display: none;
            }

            .vs-indicator {
                /* position: static; */
                /* margin: 15px auto; */
                background: linear-gradient(135deg, #021D49, #e1058b);
                color: white;
                padding: 8px 16px;
                border-radius: 50px;
                font-weight: bold;
                font-size: 1rem;
                z-index: 2;
                box-shadow: 0 4px 16px rgba(0, 0, 0, 0.2);
                width: fit-content;
                text-align: center;
                display: block;
            }

            .team {
                position: relative;
                z-index: 1;
            }

            .actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }

            .participants-header {
                flex-direction: column;
                gap: 10px;
                align-items: stretch;
            }
        }
    </style>
</head>
<body>
    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div class="loading-text">Carregando reserva...</div>
            <div class="loading-subtitle">Aguarde enquanto buscamos os dados</div>
        </div>
    </div>

    <div class="container">
        <div class="header">
            <h1><i class="fas fa-table-tennis"></i> Reserva de Quadra</h1>
        </div>

        <div class="content">
            <div class="info-grid">
                <div class="info-card">
                    <h3>
                        <span class="icon">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640">
                                <path d="m312,527.8c0,-55.2 21.1,-110.4 63.3,-152.6c42.2,-42.2 97.3,-63.2 152.5,-63.2c-4.1,-108.5 -91.3,-195.7 -199.8,-199.8c0,55.2 -21.1,110.4 -63.3,152.6c-42.2,42.2 -97.3,63.2 -152.5,63.2c4.1,108.5 91.3,195.7 199.8,199.8zm48,-3.7c82.8,-16.1 148,-81.4 164.1,-164.1c-41.7,1 -83.1,17.3 -114.9,49.2c-31.8,31.9 -48.2,73.2 -49.2,115l0,-0.1zm-244.1,-244.1c41.7,-1 83.1,-17.3 114.9,-49.2c31.8,-31.9 48.2,-73.2 49.2,-114.9c-82.8,16.1 -148,81.3 -164.1,164.1zm-51.9,40c0,-141.4 114.6,-256 256,-256c141.4,0 256,114.6 256,256c0,141.4 -114.6,256 -256,256c-141.4,0 -256,-114.6 -256,-256z" fill="white"/>
                            </svg>

                    </h3>
                    <div class="info-value"></div>

                </div>

                <div class="info-card">
                    <h3>
                        <span class="icon"><i class="fas fa-calendar-alt"></i></span>
                        Data
                    </h3>
                    <div class="info-value"></div>
                    <!-- <div class="info-detail">Quinta-feira</div> -->

                <div class="info-card">
                    <h3>
                        <span class="icon"><i class="fas fa-clock"></i></span>

            <div class="participants">

                <div class="participants-container">
                    <!-- Layout Duplas (2x2) - padrão -->
                    <div id="doubles-container" class="doubles-layout">

                        </div>
                        
                        <div class="vs-indicator">VS</div>

                            <div class="player">

                    <div id="singles-container" class="singles-layout" style="display: none;">

                <button class="btn btn-extend" onclick="extendReservation()">

    <script>
        function getInitials(nomeCompleto) {
            if (!nomeCompleto) return "";

            const nomes = nomeCompleto.trim().split(/\s+/);

            if (nomes.length > 1) {
                // Mais de um nome: primeira letra do primeiro e do segundo
                return (nomes[0][0] + nomes[1][0]).toUpperCase();
            } else {
                // Apenas um nome: primeira letra + segunda consoante
                const nome = nomes[0];
                const consoantes = nome
                    .toUpperCase()
                    .split("")
                    .filter(c => /[BCDFGHJKLMNPQRSTVWXYZ]/.test(c));
                
                if (consoantes.length < 2) {
                    // Caso não tenha segunda consoante, repete a primeira letra
                    return consoantes[0] || "";
                }

                return consoantes[0] + consoantes[1];
            }
        }

        function hideLoading() {
            const loadingOverlay = document.getElementById('loadingOverlay');
            loadingOverlay.classList.add('hidden');
        }

        function extendReservation() {
            if (confirm('Deseja estender o horário da reserva? \n\nHorários disponíveis:\n• 16:00 - 17:00 (+1h)\n• 16:00 - 18:00 (+2h)')) {
                // Simulação de extensão
                const timeCard = document.querySelector('.info-card:nth-child(3) .info-value');
                timeCard.textContent = '14:00 - 17:00';
                
                const detailCard = document.querySelector('.info-card:nth-child(3) .info-detail');
                detailCard.textContent = '3 horas reservadas';
                
                // Mostrar confirmação
                const badge = document.querySelector('.status-badge');
                if (badge) {
                    badge.innerHTML = '<i class="fas fa-check-circle"></i> Reserva Estendida';
                    badge.style.background = 'linear-gradient(135deg, #FF9800, #F57C00)';
                    
                    setTimeout(() => {
                        badge.innerHTML = '<i class="fas fa-check-circle"></i> Reserva Ativa';
                        badge.style.background = 'linear-gradient(135deg, #e1058b, #c4047a)';
                    }, 3000);
                }
            }
        }

        function cancelReservation() {
            if (confirm('Tem certeza que deseja cancelar esta reserva?\n\nEsta ação não pode ser desfeita.')) {
                // Simulação de cancelamento
                const badge = document.querySelector('.status-badge');
                if (badge) {
                    badge.innerHTML = '<i class="fas fa-times-circle"></i> Reserva Cancelada';
                    badge.style.background = 'linear-gradient(135deg, #021D49, #0a2a5e)';
                    badge.style.boxShadow = '0 4px 12px rgba(2, 29, 73, 0.3)';
                }
                
                // Desabilitar botões
                const buttons = document.querySelectorAll('.btn, .format-toggle');
                buttons.forEach(btn => {
                    btn.disabled = true;
                    btn.style.opacity = '0.5';
                    btn.style.cursor = 'not-allowed';
                });
                
                // Adicionar overlay de cancelamento
                const content = document.querySelector('.content');
                content.style.opacity = '0.7';
            }
        }

        function showErrorMessage() {
            hideLoading();
            document.querySelector('.container').innerHTML = `
                <div class="header">
                    <h1><i class="fas fa-exclamation-triangle"></i> Erro</h1>
                </div>
                <div class="content" style="text-align: center; padding: 80px 40px;">
                    <div style="font-size: 1.5rem; font-weight: 600; color: #021D49; margin-bottom: 16px;">
                        Não foi possível carregar dados da reserva de quadra.
                    </div>
                    <div style="color: #666; font-size: 1rem; margin-bottom: 32px;">
                        Verifique agendamento e tente novamente mais tarde
                    </div>
                </div>
            `;
        }

        window.addEventListener('load', () => {
             try {
                const params = new URLSearchParams(window.location.search);
                const idAgendamento = params.get("IDAGENDAMENTO");
                const chave = params.get("CHAVE");

                if (!idAgendamento || !chave) {
                    showErrorMessage();
                } else {
                    const url = `https://clubepaineiras.com.br/AliveTeste/Alive.App.Locais/Reservas.asmx/ExibirReserva?IDAGENDAMENTO=${encodeURIComponent(idAgendamento)}&CHAVE=${encodeURIComponent(chave)}`;

                    fetch(url)
                    .then(resp => resp.text())
                    .then(text => {
                        
                        const dataList = JSON.parse(text);
                        const data = dataList[0];
                
                        
                        // Atualizar informações da quadra
                        document.querySelector('.info-card:nth-child(1) .info-value').textContent = data.LOCAL;
                        // document.querySelector('.info-card:nth-child(1) .info-detail').textContent = data.LOCAL;

                        // Atualizar data
                        document.querySelector('.info-card:nth-child(2) .info-value').textContent = data.DATA;
                        // document.querySelector('.info-card:nth-child(2) .info-detail').textContent = data.DATA;

                        // Atualizar horário
                        document.querySelector('.info-card:nth-child(3) .info-value').textContent = data.HORARIO;
                        // document.querySelector('.info-card:nth-child(3) .info-detail').textContent = data.HORARIO;

                        // Atualizar modalidade
                        let isDoublesFormat = data.PARTICIPANTES.length === 2;
                        document.getElementById('modalidade-text').textContent = isDoublesFormat ? "Singles" : "Duplas";

                        if (isDoublesFormat) {
                            document.getElementById('modalidade-detail').textContent = '2 jogadores';
                            document.getElementById('doubles-container').style.display = 'none';
                            document.getElementById('singles-container').style.display = 'grid';

                            // Atualizar jogadores no layout de singles
                            const singlesPlayers = document.querySelectorAll('#singles-container .player');

                            // Jogador 1
                            singlesPlayers[0].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[0].ASSOCIADO);
                            singlesPlayers[0].querySelector('.player-name').textContent = data.PARTICIPANTES[0].ASSOCIADO;
                            singlesPlayers[0].querySelector('.player-role').textContent = data.PARTICIPANTES[0].TITULO;
                            
                            // Jogador 2
                            singlesPlayers[1].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[1].ASSOCIADO);
                            singlesPlayers[1].querySelector('.player-name').textContent = data.PARTICIPANTES[1].ASSOCIADO;
                            singlesPlayers[1].querySelector('.player-role').textContent = data.PARTICIPANTES[1].TITULO;

                        } else {
                            document.getElementById('modalidade-detail').textContent = '4 jogadores';
                            document.getElementById('doubles-container').style.display = 'grid';
                            document.getElementById('singles-container').style.display = 'none';

                            // Atualizar jogadores no layout de duplas
                            const doublesPlayers = document.querySelectorAll('#doubles-container .player');

                            // Time A - Jogador 1
                            doublesPlayers[0].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[0].ASSOCIADO);
                            doublesPlayers[0].querySelector('.player-name').textContent = data.PARTICIPANTES[0].ASSOCIADO;
                            doublesPlayers[0].querySelector('.player-role').textContent = data.PARTICIPANTES[0].TITULO;
                            
                            // Time A - Jogador 2
                            doublesPlayers[1].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[1].ASSOCIADO);
                            doublesPlayers[1].querySelector('.player-name').textContent = data.PARTICIPANTES[1].ASSOCIADO;
                            doublesPlayers[1].querySelector('.player-role').textContent = data.PARTICIPANTES[1].TITULO;
                            
                            // Time B - Jogador 3
                            doublesPlayers[2].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[2].ASSOCIADO);
                            doublesPlayers[2].querySelector('.player-name').textContent = data.PARTICIPANTES[2].ASSOCIADO;
                            doublesPlayers[2].querySelector('.player-role').textContent = data.PARTICIPANTES[2].TITULO;
                            
                            // Time B - Jogador 4
                            doublesPlayers[3].querySelector('.player-avatar').textContent = getInitials(data.PARTICIPANTES[3].ASSOCIADO);
                            doublesPlayers[3].querySelector('.player-name').textContent = data.PARTICIPANTES[3].ASSOCIADO;
                            doublesPlayers[3].querySelector('.player-role').textContent = data.PARTICIPANTES[3].TITULO;
                        }

                        // Animação suave na troca
                        const participantsContainer = document.querySelector('.participants-container');
                        participantsContainer.style.opacity = '0.7';
                        setTimeout(() => {
                            participantsContainer.style.opacity = '1';
                        }, 300);

                        // Esconder loading após carregar os dados
                        hideLoading();
                    })
                    .catch(err => {
                        console.error("Erro ao chamar serviço: " + err.message);
                        showErrorMessage();
                    });
                }
            } catch (error) {
                console.error("Erro ao carregar reserva de quadra!", error);
                showErrorMessage();
            }
            
            // Depois, executar as animações
            const cards = document.querySelectorAll('.info-card, .participants');
            cards.forEach((card, index) => {
                card.style.opacity = '0';
                card.style.transform = 'translateY(20px)';
                
                setTimeout(() => {
                    card.style.transition = 'all 0.6s ease';
                    card.style.opacity = '1';
                    card.style.transform = 'translateY(0)';
                }, index * 100);
            });
        });
    </script>
</body>
</html>
